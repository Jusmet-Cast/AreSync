name: fitcodex
description: Coach de entrenamiento, nutricion y telemetria en una sola app.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

# Orden alfabetico porque el lint sort_pub_dependencies esta activo.
dependencies:
  # Cliente HTTP hacia el backend .NET donde viven los agentes.
  dio: ^5.4.0

  # Persistencia local. La app tiene que registrar series en un gimnasio sin
  # senal y grabar rutas sin datos: el origen de verdad es local y el backend
  # sincroniza despues.
  drift: ^2.18.0

  flutter:
    sdk: flutter

  # Estado. Elegido sobre alternativas por volumen de documentacion: siendo un
  # solo dev, importa mas poder buscar una respuesta que la elegancia.
  flutter_riverpod: ^2.5.0

  # Ubicacion para aventuras. OJO: geolocator cubre el primer plano. Para
  # grabar 4 h con la pantalla apagada hay que evaluar
  # flutter_background_geolocation (licencia comercial) antes de comprometerse.
  geolocator: ^12.0.0

  # Navegacion declarativa. StatefulShellRoute mantiene el estado de cada pilar
  # al cambiar de pestana, que es lo que espera una NavigationBar M3.
  go_router: ^14.0.0

  # Tipografia. En produccion conviene empaquetar los .ttf como assets:
  # google_fonts los descarga en runtime y esta app arranca offline.
  google_fonts: ^6.2.0

  # Telemetria agnostica del wearable: habla con Apple Health y Health Connect,
  # no con fabricantes. Garmin, Polar, Oura y Xiaomi escriben ahi y nosotros
  # leemos de ahi. Ver core/domain/ports/telemetry_source.dart
  health: ^11.0.0

  path: ^1.9.0
  path_provider: ^2.1.0
  sqlite3_flutter_libs: ^0.5.0

dev_dependencies:
  build_runner: ^2.4.0
  drift_dev: ^2.18.0
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
